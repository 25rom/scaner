name: Обновление цен

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Сохранить данные
        run: |
          git config user.name "price-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/lots.json data/lots.js
          git diff --cached --quiet || git commit -m "Обновление цен"
          git push
